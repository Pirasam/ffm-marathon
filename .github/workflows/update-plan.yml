name: Tagesupdate

# Der Mac holt die Garmin-Daten (sync_garmin.py) und pusht garmin_data.json.
# Dieser Workflow rendert daraus nur das Dashboard – er ruft KEIN Garmin auf
# und braucht KEIN Garmin-Secret mehr. Grund: Garmin blockt den Token-Refresh
# aus GitHub-IPs; der Mac erneuert seine Sitzung dagegen bei jedem Lauf selbst.
#
# Einzige Voraussetzung in der Cloud: der ANTHROPIC_API_KEY (fuer die Analyse).

on:
  push:
    paths:
      - "garmin_data.json"          # Mac hat frische Daten geliefert
      - "update_plan.py"
      - "index.html"
      - ".github/workflows/update-plan.yml"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tagesupdate
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # HEAD~1 fuer den Code-Aenderungs-Vergleich noetig

      # Rendern, wenn (a) die RENDER-LOGIK sich geaendert hat (update_plan.py /
      # garmin_client.py im letzten Commit) ODER (b) die Daten nicht mehr zum
      # Dashboard passen. Der eigene index.html-Commit loest KEINE Endlosschleife
      # aus, weil er weder Code noch Metriken aendert.
      - name: Rendern noetig?
        id: diff
        run: |
          CODE=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E 'update_plan.py|garmin_client.py' || true)
          if [ -n "$CODE" ]; then
            echo "Render-Code geaendert -> neu rendern."
            echo "render=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          # Nur Werte, die sich wirklich ~1x/Tag aendern (nicht Body Battery /
          # Training Readiness - die schwanken staendig im Tagesverlauf und
          # loesten dadurch mehrmals taeglich ein teures Opus-Rendern aus).
          # last_run_* faengt stattdessen den eigentlich relevanten Fall ab:
          # ein neuer Lauf wurde eingetragen -> Empfehlung soll das sehen.
          KEYS = ("hrv_value","resting_hr","sleep_hours","weight_kg")
          def extract(metrics, sync_date):
              data = {k: metrics.get(k) for k in KEYS}
              data["sync_date"] = sync_date
              lr = metrics.get("last_run") or {}
              data["last_run_date"] = lr.get("date")
              data["last_run_dist"] = lr.get("distance_km")
              return data
          try:
              d = json.load(open("garmin_data.json"))
              data = extract(d["metrics"], d.get("sync_date"))
          except Exception:
              print("render=false"); raise SystemExit(0)
          try:
              html = open("index.html", encoding="utf-8").read()
              cur = json.loads(re.search(r"window\.GARMIN_DATA\s*=\s*(\{.*?\});",
                                         html, re.DOTALL).group(1))
              shown = extract(cur, cur.get("data_sync_date"))
          except Exception:
              shown = None
          print("render=" + ("true" if shown != data else "false"))
          PY

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.render == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        if: steps.diff.outputs.render == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Dashboard rendern
        if: steps.diff.outputs.render == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_plan.py

      - name: Aenderungen pushen
        if: steps.diff.outputs.render == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Marathon Bot"
          git config user.email "marathon-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Nichts geaendert."; exit 0
          fi
          git commit -m "Dashboard: $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash --quiet origin main && git push --quiet && exit 0
            echo "Push-Versuch $i fehlgeschlagen …"; sleep 10
          done
          exit 1
